# A SECOND, isolated bluedb cluster for running Jepsen in parallel with the
# primary `docker-compose.yml` stack (e.g. two test sessions at once). Identical
# topology, but a distinct project name (`bluedb2` → containers `bluedb2-*`,
# network `bluedb2_default`) and node host ports 8091/8092/8093 so nothing
# collides with the primary stack's 8081-8083 / 9000-9001. Reuses the already
# built `bluedb-server:dev` image (no build section), so it starts in seconds.
#
#   docker compose -f docker-compose.bluedb2.yml up -d
#   # then point Jepsen at it:
#   BLUEDB_JEPSEN_PROJECT=bluedb2 BLUEDB_JEPSEN_BASE_PORT=8091 \
#     bin/lein run test --workload list-append --nemesis none --time-limit 60 \
#     --concurrency 10 --node node1 --node node2 --node node3
#
# MinIO is internal-only here (no host port) — Jepsen never talks to it directly;
# the nodes reach it over the project network and the nemesis acts via the docker
# CLI by container name (`bluedb2-minio-1`).
name: bluedb2

x-node-env: &node-env
  BLUEDB_S3_BUCKET: bluedb
  BLUEDB_S3_ENDPOINT: http://minio:9000
  BLUEDB_S3_ACCESS_KEY_ID: minioadmin
  BLUEDB_S3_SECRET_ACCESS_KEY: minioadmin
  BLUEDB_S3_REGION: us-east-1
  BLUEDB_DB_PATH: bluedb
  BLUEDB_LEASE_PG_URL: postgresql://postgres:bluedb@postgres:5432/bluedb
  BLUEDB_LEASE_TTL_SECS: "10"
  BLUEDB_LEASE_MARGIN_SECS: "3"
  BLUEDB_ENABLE_ADMIN_SQL: "1"

x-node-deps: &node-deps
  postgres:
    condition: service_healthy
  createbucket:
    condition: service_completed_successfully

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data:size=512m

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done;
        /usr/bin/mc mb -p local/bluedb || true;
        echo 'bucket ready';

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: bluedb
      POSTGRES_DB: bluedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluedb"]
      interval: 2s
      timeout: 3s
      retries: 30

  node1:
    image: bluedb-server:dev
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node1
    ports:
      - "8091:8080"

  node2:
    image: bluedb-server:dev
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node2
    ports:
      - "8092:8080"

  node3:
    image: bluedb-server:dev
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node3
    ports:
      - "8093:8080"
