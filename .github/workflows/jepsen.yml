name: jepsen

on:
  pull_request:
    paths:
      - "jepsen/**"
      - ".github/workflows/jepsen.yml"
  push:
    branches: [dev]
    paths:
      - "jepsen/**"
      - ".github/workflows/jepsen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Jepsen unit tests
        working-directory: jepsen
        run: |
          java -version
          export LEIN_HOME="$PWD/.lein"
          ./bin/lein test
