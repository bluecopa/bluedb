[package]
name = "bluedb-lakehouse"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
bluedb-sql = { workspace = true }
gluesql-core = "=0.19.0"
arrow-array = "57"
arrow-schema = "57"
iceberg = "0.9.1"
parquet = "57"
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# metadata.json (TableMetadata) (de)serialization for our self-hosted catalog,
# and the durable mirror registry.
serde = { workspace = true }
serde_json = { workspace = true }
# Collecting the Iceberg reader's Arrow record-batch stream in tests + the seal path.
futures = "0.3"
# OutputFile::write takes bytes::Bytes (metadata.json + version-hint writes).
bytes = { workspace = true }
# Bridge iceberg's pluggable Storage onto the same object store as SlateDB, so
# the mirror writes Iceberg into the same bucket the warehouse reads from.
object_store = "0.12"
async-trait = { workspace = true }
# iceberg's Storage/StorageFactory traits require typetag::serde.
typetag = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# Engine tests drive a real Database over an in-memory SlateDB.
slatedb = { workspace = true }
# The seal-latency harness (`tests/seal_latency_gcs.rs`) builds a real GCS
# `ObjectStore` — needs object_store's `gcp` feature (the lib dep above doesn't
# enable it). Pinned to the workspace-resolved 0.12.5 so the `Arc<dyn ObjectStore>`
# unifies with both `object_store_file_io` and slatedb's `Db::open`.
object_store = { version = "=0.12.5", features = ["gcp"] }
