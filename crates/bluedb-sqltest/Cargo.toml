[package]
name = "bluedb-sqltest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "SQL standard-conformance test harness for bluedb: runs sqllogictest corpora against GlueSQL-on-SlateDB and reports feature coverage."
publish = false

[dependencies]
# Same engine + exact version the rest of bluedb is written against.
bluedb-sql   = { workspace = true }
gluesql-core = "=0.19.0"
slatedb      = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
# de-facto SQL correctness harness in the Rust ecosystem (RisingWave/GreptimeDB).
sqllogictest = "0.29"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
