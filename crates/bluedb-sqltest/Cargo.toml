[package]
name = "bluedb-sqltest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "SQL standard-conformance test harness for bluedb: runs sqllogictest corpora against the GlueSQL write path and the DataFusion read front door, and reports feature coverage."
publish = false

[dependencies]
# Same engine + exact version the rest of bluedb is written against.
bluedb-sql       = { workspace = true }
# The read front door: DataFusion over the bluedb schema provider + lakehouse engine.
bluedb-query     = { path = "../bluedb-query" }
bluedb-lakehouse = { path = "../bluedb-lakehouse" }
gluesql-core     = "=0.19.0"
arrow-array      = "57"
arrow-schema     = "57"
slatedb          = { workspace = true }
tokio            = { workspace = true }
async-trait      = { workspace = true }
thiserror        = { workspace = true }
anyhow           = { workspace = true }
# de-facto SQL correctness harness in the Rust ecosystem (RisingWave/GreptimeDB).
sqllogictest     = "0.29"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
