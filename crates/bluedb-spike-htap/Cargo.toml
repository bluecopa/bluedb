# THROWAWAY SPIKE crate — de-risks the HTAP unified-query design (slice 1):
# prove DataFusion can query a real Iceberg table (via iceberg-datafusion)
# UNIONed with an in-memory Arrow table, with an arbitrary-column filter +
# ORDER BY, returning correct merged+sorted rows with clean types.
#
# Dep pins were a compatibility gate: the workspace already runs arrow/parquet
# 57.3.1 (via iceberg 0.9.1); iceberg-datafusion 0.9.1 declares `datafusion
# ^52.2`, which itself pulls arrow 57 — so the whole set unifies on arrow 57.
[package]
name = "bluedb-spike-htap"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
# Pure-DataFusion querier (no datafusion-postgres yet — that's a later slice).
datafusion = "52"
# iceberg 0.9.1 ships the memory catalog IN-CRATE (module `iceberg::memory`);
# there is NO usable standalone `iceberg-catalog-memory` 0.9.1 on crates.io
# (it's a 0.0.0 placeholder), so we lean on the bundled one.
iceberg = "0.9.1"
iceberg-datafusion = "0.9.1"
arrow = "57"
parquet = "57"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
futures = "0.3"
