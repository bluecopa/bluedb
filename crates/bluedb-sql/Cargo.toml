[package]
name = "bluedb-sql"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "SQL engine for bluedb: GlueSQL custom storage over SlateDB (schemaless tables on object storage)."

[dependencies]
# GlueSQL execution layer + pluggable Store/StoreMut traits. Pinned exact: the
# custom-storage trait surface shifts between minor versions, so we lock the
# version whose trait signatures this crate is written against.
gluesql-core   = "=0.19.0"
bluedb-storage = { workspace = true }
slatedb        = { workspace = true }
tokio        = { workspace = true }
async-trait  = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
bytes        = { workspace = true }
# `RowIter` is a `futures::Stream`; we build it with `futures::stream::iter`.
# Pinned to the same 0.3 line gluesql-core itself depends on.
futures      = "0.3"
# `SchemaIndex::created` is a `chrono::NaiveDateTime`; we stamp new indexes with
# `Utc::now()`. Same 0.4 line gluesql-core resolves.
chrono       = "0.4"
# SQL rewrite shim (comma-join -> INNER JOIN ON TRUE). Pinned to the exact
# version gluesql-core 0.19 uses so the AST and re-serialized SQL round-trip.
sqlparser    = "=0.52.0"
# Construct the `LIMIT` literal the scan guardrail injects to bound an
# unfiltered SELECT. Pinned to the exact line gluesql-core 0.19 uses for
# `ast::Literal::Number(BigDecimal)`, so the AST type matches.
bigdecimal   = "=0.4.10"
# Compact binary encoding for CDC-log entries (the lakehouse mirror). Smaller and
# faster than JSON for the high-volume change log; data rows themselves still use
# serde_json (see `storage::encode`).
postcard     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# GlueSQL's official custom-storage conformance battery (Store/StoreMut/Index/
# Transaction/AlterTable/Metadata). Pinned to the same core version.
gluesql-test-suite = "=0.19.0"
