[package]
name = "bluedb-fts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "BM25 full-text search over object storage (tantivy + vendored quickwit-directories read path)."

[dependencies]
bluedb-storage = { workspace = true }
# Vendored quickwit-directories read path (crates/bluedb-fts/vendor/).
# `stemmer` is additive on top of the workspace feature set: the per-field
# `Analyzer::EnStem` mapping (src/mapping.rs) needs `tokenizer::{Stemmer, Language}`,
# which the fork gates behind that feature. Cargo unifies features across the
# workspace, so requesting it here doesn't change the pinned rev/source.
tantivy     = { workspace = true, features = ["stemmer"] }
async-trait = { workspace = true }
anyhow      = { workspace = true }
bytes       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
postcard    = { workspace = true }
thiserror   = { workspace = true }
time        = { workspace = true }
tracing     = { workspace = true }
# The indexer builds tantivy indexes in a tempdir before packing them.
tempfile    = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
slatedb  = { workspace = true }
