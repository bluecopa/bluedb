[package]
name = "bluedb-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "bluedb HTTP/REST service: a PostgREST-style data API over bluedb-engine."

[[bin]]
name = "bluedb-server"
path = "src/main.rs"

[features]
# Build the deployable binary with the Kubernetes-native node registry
# (`K8sNodeRegistry`, via kube-rs). Off by default so the default/CI build never
# pulls kube/k8s-openapi; turn on for the in-cluster image.
kubernetes = ["bluedb-ha/kubernetes"]

[dependencies]
bluedb-engine    = { workspace = true }
bluedb-sql       = { workspace = true }
bluedb-ledger    = { workspace = true }
bluedb-rest      = { workspace = true }
bluedb-lakehouse = { workspace = true }
bluedb-evidence  = { workspace = true }
bluedb-query     = { path = "../bluedb-query" }
bluedb-cache     = { path = "../bluedb-cache" }
arrow-json       = "57"
arrow-array      = "57"
arrow-schema     = "57"
chrono           = "0.4"
# `postgres` feature so the deployable binary can use the Postgres lease arbiter
# for real multi-node election (BLUEDB_LEASE_PG_URL).
bluedb-ha     = { workspace = true, features = ["postgres"] }
gluesql-core  = "=0.19.0"
slatedb       = { workspace = true }
# Multi-cloud object-store backends (S3/Azure/GCS). Pinned to the exact version
# slatedb 0.13 already resolves so the `dyn ObjectStore` types unify into one
# copy; the azure/gcp features add the non-AWS builders slatedb doesn't enable.
object_store  = { version = "=0.12.5", features = ["aws", "azure", "gcp"] }
axum          = { version = "0.8", features = ["http2"] }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
base64        = { workspace = true }
# Percent-decode the `/tables` query string before parsing (a JSON-path key like
# `data->>status` arrives `%3E%3E`-encoded from any conformant HTTP client).
percent-encoding = "2"
# Evidence digest signing (ES256 / ECDSA P-256). The `pem`/`pkcs8` feature set
# exposes SPKI PEM encode/decode for the local signer + the e2e verify helper.
p256          = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
# Vault Transit signing backend talks HTTPS+JSON to Vault. Features are additive
# over the existing `http2` (kept for the http2 integration test).
reqwest       = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }

[dev-dependencies]
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile       = { workspace = true }
