# Object-store emulators for the multi-cloud round-trip tests
# (crates/bluedb-server/tests/objstore_emulators.rs).
#
#   docker compose -f crates/bluedb-server/tests/emulators/docker-compose.yml up -d
#   cargo test -p bluedb-server --test objstore_emulators -- --ignored --nocapture
#   docker compose -f crates/bluedb-server/tests/emulators/docker-compose.yml down -v
#
# Each backend gets a bucket/container named "bluedb", created by an init
# one-shot once the server is reachable. Host ports: 9000 (S3), 10000 (Azure),
# 4443 (GCS).
name: bluedb-emulators

services:
  # ---------------------------------------------------------------- S3 (MinIO)
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done;
        /usr/bin/mc mb -p local/bluedb || true;
        echo 'minio bucket ready';

  # ------------------------------------------------------------ Azure (Azurite)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"

  azurite-init:
    image: mcr.microsoft.com/azure-cli:latest
    depends_on: [azurite]
    environment:
      # Well-known Azurite account + key, blob endpoint inside the compose net.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until az storage container create -n bluedb >/dev/null 2>&1; do
          echo 'waiting for azurite...'; sleep 2;
        done;
        echo 'azurite container ready';

  # ---------------------------------------------------- GCS (fake-gcs-server)
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -public-host localhost:4443
    ports:
      - "4443:4443"

  fake-gcs-init:
    image: curlimages/curl:latest
    depends_on: [fake-gcs]
    entrypoint:
      - /bin/sh
      - -c
      - >
        until curl -sf -X POST 'http://fake-gcs:4443/storage/v1/b?project=test' -H 'Content-Type: application/json' -d '{"name":"bluedb"}'; do
          echo 'waiting for fake-gcs...'; sleep 2;
        done;
        echo 'fake-gcs bucket ready';
