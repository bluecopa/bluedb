# A local bluedb cluster for failover testing / Jepsen: a shared MinIO object
# store, a Postgres lease arbiter, and three bluedb-server nodes. All three
# bootstrap; the Postgres lease elects exactly one writer, the others follow as
# read replicas. Kill the writer and a standby takes over within ~TTL seconds.
#
#   docker compose up -d --build
#   curl localhost:8081/admin/status   # (8081/8082/8083 = node1/2/3)
name: bluedb

x-node-env: &node-env
  BLUEDB_S3_BUCKET: bluedb
  BLUEDB_S3_ENDPOINT: http://minio:9000
  BLUEDB_S3_ACCESS_KEY_ID: minioadmin
  BLUEDB_S3_SECRET_ACCESS_KEY: minioadmin
  BLUEDB_S3_REGION: us-east-1
  BLUEDB_DB_PATH: bluedb
  BLUEDB_LEASE_PG_URL: postgresql://postgres:bluedb@postgres:5432/bluedb
  BLUEDB_LEASE_TTL_SECS: "10"
  BLUEDB_LEASE_MARGIN_SECS: "3"

x-node-deps: &node-deps
  postgres:
    condition: service_healthy
  createbucket:
    condition: service_completed_successfully

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    # Size-bounded RAM-backed data dir: ample for the small test data, but lets
    # the disk-full nemesis fill it to trigger ENOSPC without filling the VM disk.
    tmpfs:
      - /data:size=512m

  # One-shot: wait for MinIO, create the bucket, exit.
  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 1;
        done;
        /usr/bin/mc mb -p local/bluedb || true;
        echo 'bucket ready';

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: bluedb
      POSTGRES_DB: bluedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluedb"]
      interval: 2s
      timeout: 3s
      retries: 30

  node1:
    image: bluedb-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node1
    ports:
      - "8081:8080"

  node2:
    image: bluedb-server:dev
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node2
    ports:
      - "8082:8080"

  node3:
    image: bluedb-server:dev
    depends_on: *node-deps
    environment:
      <<: *node-env
      BLUEDB_NODE_ID: node3
    ports:
      - "8083:8080"
